<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <title>🃏 卡牌对战 - 抽卡游戏</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 状态栏 -->
    <div class="status-bar">
      <div id="currency-normal">💰 500</div>
      <div id="currency-special">💎 5</div>
      <div id="exchange-count">🎟️ 0</div>
      <div id="save-status" class="save-status" title="游戏进度自动保存">💾 已保存</div>
    </div>

    <!-- 主内容区 -->
    <main id="main-content">
      <!-- 首页 -->
      <section id="view-home" class="view"></section>

      <!-- 商店 -->
      <section id="view-shop" class="view hidden"></section>

      <!-- 仓库 -->
      <section id="view-warehouse" class="view hidden"></section>

      <!-- 图鉴 -->
      <section id="view-collection" class="view hidden"></section>

      <!-- 背包 -->
      <section id="view-inventory" class="view hidden"></section>
    </main>

    <!-- 底部Tab导航 -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-view="home">
        <span class="tab-icon">🏠</span>
        <span>首页</span>
      </button>
      <button class="tab-btn" data-view="shop">
        <span class="tab-icon">🛒</span>
        <span>商店</span>
      </button>
      <button class="tab-btn" data-view="warehouse">
        <span class="tab-icon">📦</span>
        <span>仓库</span>
      </button>
      <button class="tab-btn" data-view="collection">
        <span class="tab-icon">📖</span>
        <span>图鉴</span>
      </button>
      <button class="tab-btn" data-view="inventory">
        <span class="tab-icon">🎒</span>
        <span>背包</span>
      </button>
    </nav>
  </div>

  <!-- 脚本 -->
  <script src="js/config.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>

  <script>
    // 全局错误处理
    window.addEventListener('error', (e) => {
      console.error('Error:', e.message);
    });

    // 防止双指缩放
    document.addEventListener('gesturestart', (e) => {
      e.preventDefault();
    });

    // 防止双击缩放
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });
  </script>
</body>
</html>
